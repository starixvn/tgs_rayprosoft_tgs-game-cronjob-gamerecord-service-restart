variables:
  HelmTemplateFolderName: game-gameinterface-restart

stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "0 0 * * *"
        }
      }
      EOF

deploy-staging:
  variables:
    GIT_STRATEGY: none
    namespace: staging
  environment:
    name: staging
  stage: deploy-staging
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "0 0 * * *"
        }
      }
      EOF

deploy-prod:
  variables:
    GIT_STRATEGY: none
    namespace: prod
  environment:
    name: prod
  stage: deploy-prod
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "0 */4 * * *"
        }
      }
      EOF