variables:
  HelmTemplateFolderName: game-cronjob-gamerecord-service-restart

stages:
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

push-k8s-template:
  stage: publish
  only:
    - main
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderName artifacts/k8s/
    - |
      yq -i e '
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF

deploy-staging:
  variables:
    GIT_STRATEGY: none
    namespace: staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_staging
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF

deploy-prod:
  variables:
    GIT_STRATEGY: none
    namespace: prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_prod
  script:
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "restart": {
            "enabled": true,
            "schedule": "30 0 * * *"
        }
      }
      EOF