{{- if .Values.restart.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "game-cronjob-gamerecord-service-restart.fullname" . }}
spec:
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  schedule: '{{ .Values.restart.schedule }}'
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: {{ .Values.restart.serviceAccount }}
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl
              command:
                - bash
                - -c
                - >-
                  kubectl -n {{ .Release.Namespace }} rollout restart deployment -l tgs.gamerecord.kind=service &&
                  kubectl -n {{ .Release.Namespace }} rollout restart deployment -l tgs.gamerecord.kind=service
{{- end }}
