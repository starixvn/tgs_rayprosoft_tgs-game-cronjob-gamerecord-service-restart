{{- if .Values.restart.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.restart.serviceAccount }}
  labels:
    {{- include "game-cronjob-gamerecord-service-restart.labels" . | nindent 4 }}
  {{- with .Values.restart.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "game-cronjob-gamerecord-service-restart.fullname" . }}
  labels:
    {{- include "game-cronjob-gamerecord-service-restart.labels" . | nindent 4 }}
rules:
  - apiGroups: 
      - apps
      - extensions
    resources: 
      - deployments
    resourceNames: 
      - game-gamerecord-awc
      - game-gamerecord-bti
      - game-gamerecord-cards365
      - game-gamerecord-dg
      - game-gamerecord-evolution
      - game-gamerecord-fachai
      - game-gamerecord-habanero
      - game-gamerecord-jdb
      - game-gamerecord-jili
      - game-gamerecord-joker
      - game-gamerecord-ky
      - game-gamerecord-ly
      - game-gamerecord-obet
      - game-gamerecord-pinnacle
      - game-gamerecord-pp
      - game-gamerecord-sbo
      - game-gamerecord-sw
      - game-gamerecord-tfgaming
      - game-gamerecord-wgfm
      - game-gamerecord-wgvia
      - game-gamerecord-wmcasino
      - game-gamerecord-yeebet
    verbs: 
      - get
      - patch
      - list
      - watch 
    # "list" and "watch" are only needed
    # if you want to use `rollout status`
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "game-cronjob-gamerecord-service-restart.fullname" . }}
  labels:
    {{- include "game-cronjob-gamerecord-service-restart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "game-cronjob-gamerecord-service-restart.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.restart.serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}